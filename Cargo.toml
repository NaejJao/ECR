[package]
name = "ecr"
version = "0.1.0"
edition = "2021"
description = "Electronic Cash Registry"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
eframe = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
printpdf = "0.7"
