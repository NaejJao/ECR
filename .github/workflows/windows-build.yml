name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: ecr-windows-x64
          path: target/x86_64-pc-windows-msvc/release/ecr.exe
          if-no-files-found: error

      - name: Attach executable to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --prerelease --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/x86_64-pc-windows-msvc/release/ecr.exe --clobber
